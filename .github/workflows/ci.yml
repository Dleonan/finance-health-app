name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finance_health
          POSTGRES_USER: finance_health
          POSTGRES_PASSWORD: finance_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance_health -d finance_health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://finance_health:finance_health@localhost:5432/finance_health?schema=public
      JWT_SECRET: ci-only-secret-that-is-not-used-in-production
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @finance-health/api prisma validate
      - run: pnpm --filter @finance-health/api prisma generate
      - run: pnpm --filter @finance-health/api prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
