services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finance_health
      POSTGRES_USER: finance_health
      POSTGRES_PASSWORD: finance_health
    ports:
      - '55432:5432'
    volumes:
      - finance_health_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finance_health -d finance_health']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finance_health_pg:
